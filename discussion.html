<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>혁신 토론방</title>
<link rel="stylesheet" href="forum.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="forum.js"></script>
<script src="keywords.js"></script>
<style>
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.admin{margin-bottom:16px}
.admin .grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.admin input[type=text],.admin textarea,.admin select{width:100%}
.admin textarea{resize:vertical;min-height:60px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.topic h3{font-size:16px;margin:8px 0 4px;line-height:1.4}
.topic .desc{font-size:14px;color:#4b5563;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.topic .stats{display:flex;gap:16px;font-size:13px;color:#6b7280;margin-bottom:12px}
.topic .stats b{color:#111827;font-size:15px}
.topic .actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:40px;text-align:center;color:#6b7280}
@media(max-width:640px){.admin .grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="discussion.html">혁신 토론방</a>
  <nav><a href="dashboard.html">내 계정</a><a href="#" id="logoutBtn">로그아웃</a></nav>
</header>
<main class="wrap">
  <div class="page-head">
    <div>
      <h1>회사 혁신 방향 토론</h1>
      <p class="sub">모든 의견은 익명 이름(예: 익명 펭귄)으로 표시되며, 다른 참여자는 작성자를 알 수 없습니다.</p>
    </div>
  </div>

  <section class="panel admin" id="adminPanel" hidden>
    <h2>새 토론 만들기 (관리자)</h2>
    <form id="createForm">
      <div class="grid">
        <div>
          <label for="title">토론 주제</label>
          <input type="text" id="title" maxlength="120" required placeholder="예: 2027년 우리 회사가 가장 먼저 바꿔야 할 것은?">
        </div>
        <div>
          <label for="minutes">토론 시간</label>
          <select id="minutes">
            <option value="">제한 없음 (직접 종료)</option>
            <option value="30">30분</option>
            <option value="60" selected>60분</option>
            <option value="90">90분</option>
            <option value="120">120분</option>
            <option value="1440">24시간</option>
            <option value="10080">7일</option>
          </select>
        </div>
      </div>
      <label for="desc">설명 (선택)</label>
      <textarea id="desc" maxlength="1000" placeholder="토론 배경, 진행 방식, 참고 사항을 적어 주세요."></textarea>
      <button class="btn" id="createBtn" style="margin-top:12px">토론 시작</button>
    </form>
  </section>

  <div id="msg" class="msg error" hidden></div>
  <section class="topics" id="list"></section>
</main>
<script>
(async () => {
  const session = await Forum.requireSession();
  if (!session) return;
  Forum.bindLogout("logoutBtn");
  history.replaceState(null, "", location.pathname);
  const $ = (id) => document.getElementById(id);
  let isAdmin = false;

  function showError(text) { $("msg").textContent = text; $("msg").hidden = !text; }

  async function load() {
    const [adm, res] = await Promise.all([
      sb.rpc("is_admin"),
      sb.from("topic_summary").select("*").order("created_at", { ascending: false })
    ]);
    const err = adm.error || res.error;
    if (err) { showError(Forum.dbError(err)); return; }
    isAdmin = adm.data === true;
    $("adminPanel").hidden = !isAdmin;
    render(res.data || []);
  }

  function render(rows) {
    const list = $("list");
    if (!rows.length) {
      list.innerHTML = '<div class="panel empty" style="grid-column:1/-1">' +
        (isAdmin ? "아직 토론이 없습니다. 위에서 첫 토론을 만들어 보세요." : "아직 열린 토론이 없습니다. 관리자가 토론을 열면 여기에 표시됩니다.") +
        "</div>";
      return;
    }
    list.innerHTML = rows.map((t) => {
      const live = t.live_status === "open";
      let when = "시작 " + Forum.fmtDateTime(t.created_at);
      if (live && t.ends_at) when += " · 종료 예정 " + Forum.fmtDateTime(t.ends_at);
      if (!live) when += " · 종료 " + Forum.fmtDateTime(t.closed_at || t.ends_at);
      return `<article class="panel topic">
        <span class="badge ${live ? "open" : "closed"}">${live ? "진행 중" : "종료"}</span>
        <h3>${Forum.esc(t.title)}</h3>
        ${t.description ? `<p class="desc">${Forum.esc(t.description)}</p>` : ""}
        <div class="stats"><span>의견 <b>${t.message_count}</b></span><span>참여자 <b>${t.participant_count}</b></span></div>
        <p class="sub" style="margin:0 0 12px">${when}</p>
        <div class="actions">
          <a class="btn sm" href="room.html?id=${t.id}">${live ? "토론 참여" : "토론 내용 보기"}</a>
          <a class="btn sm secondary" href="report.html?id=${t.id}">분석 대시보드</a>
          ${isAdmin ? `<button class="btn sm danger" data-del="${t.id}">삭제</button>` : ""}
        </div>
      </article>`;
    }).join("");
  }

  $("list").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-del]");
    if (!b) return;
    if (!confirm("이 토론과 모든 의견, 반응을 삭제합니다. 되돌릴 수 없습니다. 삭제할까요?")) return;
    const { error } = await sb.rpc("delete_topic", { p_topic: Number(b.dataset.del) });
    if (error) return Forum.toast(Forum.dbError(error));
    load();
  });

  $("createForm").onsubmit = async (e) => {
    e.preventDefault();
    const btn = $("createBtn");
    btn.disabled = true;
    const minutes = $("minutes").value ? Number($("minutes").value) : null;
    const { data, error } = await sb.rpc("create_topic", {
      p_title: $("title").value.trim(),
      p_description: $("desc").value.trim(),
      p_minutes: minutes
    });
    btn.disabled = false;
    if (error) return Forum.toast(Forum.dbError(error));
    location.href = "room.html?id=" + data;
  };

  await load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
