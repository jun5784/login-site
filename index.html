<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
</head>
<body>
<main class="card">
  <!-- 로그인 -->
  <section id="loginView">
    <h1>로그인</h1>
    <p class="sub">계정에 로그인하세요.</p>
    <form id="loginForm" novalidate>
      <label for="loginEmail">이메일</label>
      <input id="loginEmail" type="email" placeholder="name@example.com" autocomplete="email" required>
      <label for="loginPw">비밀번호</label>
      <div class="field">
        <input id="loginPw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
        <button type="button" class="toggle" data-target="loginPw">표시</button>
      </div>
      <div class="row"><span></span><a id="toReset">비밀번호를 잊으셨나요?</a></div>
      <button class="btn" type="submit" id="loginBtn">로그인</button>
    </form>
    <div class="divider">또는</div>
    <button class="btn github" id="githubBtn" type="button"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> GitHub로 로그인</button>
    <p class="foot">계정이 없으신가요? <a id="toSignup">회원가입</a></p>
  </section>

  <!-- 회원가입 -->
  <section id="signupView" hidden>
    <h1>회원가입</h1>
    <p class="sub">이메일로 새 계정을 만드세요.</p>
    <form id="signupForm" novalidate>
      <label for="suEmail">이메일</label>
      <input id="suEmail" type="email" placeholder="name@example.com" autocomplete="email" required>
      <label for="suPw">비밀번호 (8자 이상)</label>
      <div class="field">
        <input id="suPw" type="password" placeholder="비밀번호" autocomplete="new-password" required minlength="8">
        <button type="button" class="toggle" data-target="suPw">표시</button>
      </div>
      <label for="suPw2">비밀번호 확인</label>
      <input id="suPw2" type="password" placeholder="비밀번호 확인" autocomplete="new-password" required>
      <button class="btn" type="submit" id="signupBtn">가입하기</button>
    </form>
    <p class="foot">이미 계정이 있으신가요? <a class="toLogin">로그인</a></p>
  </section>

  <!-- 비밀번호 재설정 요청 -->
  <section id="resetView" hidden>
    <h1>비밀번호 재설정</h1>
    <p class="sub">가입한 이메일로 재설정 링크를 보내 드립니다.</p>
    <form id="resetForm" novalidate>
      <label for="rsEmail">이메일</label>
      <input id="rsEmail" type="email" placeholder="name@example.com" autocomplete="email" required>
      <button class="btn" type="submit" id="resetBtn">재설정 링크 보내기</button>
    </form>
    <p class="foot"><a class="toLogin">로그인으로 돌아가기</a></p>
  </section>

  <div id="msg" class="msg" hidden></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const msg = $("msg");
const views = { login: $("loginView"), signup: $("signupView"), reset: $("resetView") };
function show(name) {
  Object.entries(views).forEach(([k, el]) => el.hidden = k !== name);
  showMsg(msg, "");
}
$("toSignup").onclick = () => show("signup");
$("toReset").onclick = () => show("reset");
document.querySelectorAll(".toLogin").forEach(a => a.onclick = () => show("login"));
document.querySelectorAll(".toggle").forEach(b => b.onclick = () => {
  const i = $(b.dataset.target);
  i.type = i.type === "password" ? "text" : "password";
  b.textContent = i.type === "password" ? "표시" : "숨기기";
});
const validEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
async function busy(btn, fn) {
  const t = btn.textContent; btn.disabled = true; btn.textContent = "처리 중...";
  try { await fn(); } finally { btn.disabled = false; btn.textContent = t; }
}

if (AUTH_NOT_CONFIGURED) {
  showMsg(msg, "config.js에 Supabase URL과 키를 입력해야 로그인이 동작합니다.", "warn");
} else {
  // 이미 로그인된 경우 대시보드로 이동
  sb.auth.getSession().then(({ data }) => { if (data.session) location.replace(pageUrl("dashboard.html")); });
}

$("loginForm").onsubmit = (e) => {
  e.preventDefault();
  const email = $("loginEmail").value.trim(), password = $("loginPw").value;
  if (!validEmail(email)) return showMsg(msg, "올바른 이메일을 입력해 주세요.");
  if (!password) return showMsg(msg, "비밀번호를 입력해 주세요.");
  if (AUTH_NOT_CONFIGURED) return;
  busy($("loginBtn"), async () => {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return showMsg(msg, translateError(error));
    location.replace(pageUrl("dashboard.html"));
  });
};

$("githubBtn").onclick = async () => {
  if (AUTH_NOT_CONFIGURED) return;
  const { error } = await sb.auth.signInWithOAuth({
    provider: "github",
    options: { redirectTo: pageUrl("dashboard.html") }
  });
  if (error) showMsg(msg, translateError(error));
};

$("signupForm").onsubmit = (e) => {
  e.preventDefault();
  const email = $("suEmail").value.trim(), pw = $("suPw").value, pw2 = $("suPw2").value;
  if (!validEmail(email)) return showMsg(msg, "올바른 이메일을 입력해 주세요.");
  if (pw.length < 8) return showMsg(msg, "비밀번호는 8자 이상이어야 합니다.");
  if (pw !== pw2) return showMsg(msg, "비밀번호가 일치하지 않습니다.");
  if (AUTH_NOT_CONFIGURED) return;
  busy($("signupBtn"), async () => {
    const { data, error } = await sb.auth.signUp({
      email, password: pw, options: { emailRedirectTo: pageUrl("dashboard.html") }
    });
    if (error) return showMsg(msg, translateError(error));
    if (data.session) return location.replace(pageUrl("dashboard.html"));
    showMsg(msg, "인증 메일을 보냈습니다. 메일의 링크를 눌러 가입을 완료해 주세요.", "success");
  });
};

$("resetForm").onsubmit = (e) => {
  e.preventDefault();
  const email = $("rsEmail").value.trim();
  if (!validEmail(email)) return showMsg(msg, "올바른 이메일을 입력해 주세요.");
  if (AUTH_NOT_CONFIGURED) return;
  busy($("resetBtn"), async () => {
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: pageUrl("reset.html") });
    if (error) return showMsg(msg, translateError(error));
    showMsg(msg, "재설정 링크를 보냈습니다. 메일함을 확인해 주세요.", "success");
  });
};
</script>
</body>
</html>
