<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>새 비밀번호 설정</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
</head>
<body>
<main class="card">
  <h1>새 비밀번호 설정</h1>
  <p class="sub">새로 사용할 비밀번호를 입력하세요.</p>
  <form id="form" novalidate>
    <label for="pw">새 비밀번호 (8자 이상)</label>
    <input id="pw" type="password" autocomplete="new-password" required>
    <label for="pw2">새 비밀번호 확인</label>
    <input id="pw2" type="password" autocomplete="new-password" required>
    <button class="btn" type="submit" id="btn">비밀번호 변경</button>
  </form>
  <div id="msg" class="msg" hidden></div>
  <p class="foot"><a href="index.html">로그인으로 돌아가기</a></p>
</main>
<script>
const msg = document.getElementById("msg");
if (AUTH_NOT_CONFIGURED) showMsg(msg, "config.js 설정이 필요합니다.", "warn");
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, pw2 = document.getElementById("pw2").value;
  if (pw.length < 8) return showMsg(msg, "비밀번호는 8자 이상이어야 합니다.");
  if (pw !== pw2) return showMsg(msg, "비밀번호가 일치하지 않습니다.");
  if (AUTH_NOT_CONFIGURED) return;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showMsg(msg, "재설정 링크가 만료되었거나 올바르지 않습니다. 다시 요청해 주세요.");
  const btn = document.getElementById("btn"); btn.disabled = true;
  const { error } = await sb.auth.updateUser({ password: pw });
  btn.disabled = false;
  if (error) return showMsg(msg, translateError(error));
  showMsg(msg, "비밀번호가 변경되었습니다. 잠시 후 이동합니다.", "success");
  setTimeout(() => location.replace(pageUrl("dashboard.html")), 1500);
};
</script>
</body>
</html>
